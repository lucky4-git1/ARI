[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layallm"
version = "0.1.0"
description = "Ari-LLM / LAYA-LLM: An original, decoder-only Transformer built and trained from scratch with CPU-first inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]
